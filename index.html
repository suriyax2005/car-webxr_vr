<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebXR AR + VR Model</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- WebXR AR Hit Test -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-ar-hit-test-component/dist/aframe-ar-hit-test-component.min.js"></script>
</head>

<body>

<a-scene
  vr-mode-ui="enabled: true"
  renderer="logarithmicDepthBuffer: true;"
  embedded
  ar-hit-test="target: #reticle"
  xrweb="allowedDevices: any"
>

  <!-- Camera -->
  <a-camera position="0 1.6 0"></a-camera>

  <!-- Light -->
  <a-light type="directional" intensity="1" position="1 3 2"></a-light>
  <a-light type="ambient" intensity="0.5"></a-light>

  <!-- Reticle (Ring for placement) -->
  <a-entity
    id="reticle"
    geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.07"
    material="color: green; shader: flat"
    rotation="-90 0 0"
    visible="false">
  </a-entity>

  <!-- 3D Model -->
  <a-entity
    id="model"
    gltf-model="model.glb"
    scale="0.5 0.5 0.5"
    visible="false">
  </a-entity>

</a-scene>

<script>
AFRAME.registerComponent('place-on-tap', {
  init: function () {
    const scene = this.el.sceneEl;
    const reticle = document.querySelector('#reticle');
    const model = document.querySelector('#model');

    scene.addEventListener('click', () => {
      if (reticle.visible) {
        const position = reticle.getAttribute('position');
        model.setAttribute('position', position);
        model.setAttribute('visible', true);
      }
    });
  }
});

document.querySelector('a-scene').setAttribute('place-on-tap', '');


// Show reticle when surface detected
AFRAME.registerComponent('reticle-handler', {
  init: function () {
    const reticle = document.querySelector('#reticle');

    this.el.sceneEl.addEventListener('ar-hit-test-select', function () {
      reticle.setAttribute('visible', true);
    });
  }
});

document.querySelector('a-scene').setAttribute('reticle-handler', '');

</script>

</body>
</html>
