<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR -->
  <script src="./aframe-ar-main/dist/aframe-ar.min.js"></script>

  <title>AR Jet Placement</title>
</head>

<body>

<script>
AFRAME.registerComponent('ar-placement', {
  init: function () {
    this.camera = document.querySelector("#cam");
    this.reticle = document.querySelector("#reticle");
    this.model = document.querySelector("#jet");
  },

  tick: function () {
    if (!this.camera) return;

    // Get camera direction
    let direction = new THREE.Vector3();
    this.camera.object3D.getWorldDirection(direction);

    // Position reticle in front of camera (simulate ground detection)
    let pos = this.camera.object3D.position.clone();
    direction.multiplyScalar(2); // distance forward
    pos.add(direction);

    // Force Y = 0 (ground level)
    pos.y = 0;

    this.reticle.setAttribute("position", pos);
  }
});

// Tap to place model
window.addEventListener("click", function () {
  let reticle = document.querySelector("#reticle");
  let model = document.querySelector("#jet");

  let pos = reticle.getAttribute("position");

  model.setAttribute("position", pos);
  model.setAttribute("visible", true);
});
</script>

<a-scene ar ar-placement>

  <!-- CAMERA -->
  <a-camera id="cam"></a-camera>

  <!-- RETICLE (ground indicator) -->
  <a-ring
    id="reticle"
    rotation="-90 0 0"
    radius-inner="0.1"
    radius-outer="0.12"
    color="green">
  </a-ring>

  <!-- YOUR JET MODEL -->
  <a-entity
    id="jet"
    gltf-model="jet.glb"
    scale="0.5 0.5 0.5"
    visible="false">
  </a-entity>

</a-scene>

</body>
</html>
