<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>REAL AR Placement</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

<a-scene
  xr-mode-ui="enabled: true"
  renderer="colorManagement: true; physicallyCorrectLights: true;"
  webxr="requiredFeatures: hit-test">

  <!-- CAMERA -->
  <a-camera position="0 1.6 0"></a-camera>

  <!-- LIGHTS -->
  <a-light type="directional" intensity="1.5" position="10 10 5"></a-light>
  <a-light type="ambient" intensity="0.7"></a-light>

  <!-- RETICLE (REAL SURFACE DETECTION) -->
  <a-entity
    id="reticle"
    visible="false"
    geometry="primitive: ring; radiusInner: 0.1; radiusOuter: 0.12"
    material="color: green"
    rotation="-90 0 0">
  </a-entity>

  <!-- JET MODEL -->
  <a-entity
    id="jet"
    gltf-model="jet.glb"
    scale="0.5 0.5 0.5"
    visible="false">
  </a-entity>

</a-scene>

<script>
let reticle = document.querySelector('#reticle');
let jet = document.querySelector('#jet');

let hitTestSource = null;
let viewerSpace = null;

AFRAME.scenes[0].renderer.xr.addEventListener('sessionstart', async () => {
  const session = AFRAME.scenes[0].renderer.xr.getSession();

  viewerSpace = await session.requestReferenceSpace('viewer');
  hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
});

AFRAME.scenes[0].renderer.setAnimationLoop((timestamp, frame) => {
  if (!frame || !hitTestSource) return;

  const referenceSpace = AFRAME.scenes[0].renderer.xr.getReferenceSpace();
  const hitTestResults = frame.getHitTestResults(hitTestSource);

  if (hitTestResults.length > 0) {
    const hit = hitTestResults[0];
    const pose = hit.getPose(referenceSpace);

    reticle.object3D.visible = true;
    reticle.object3D.position.set(
      pose.transform.position.x,
      pose.transform.position.y,
      pose.transform.position.z
    );
  } else {
    reticle.object3D.visible = false;
  }
});

// Tap to place
window.addEventListener("click", () => {
  if (!reticle.object3D.visible) return;

  jet.object3D.position.copy(reticle.object3D.position);
  jet.setAttribute("visible", true);
});
</script>

</body>
</html>
