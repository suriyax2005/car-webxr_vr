<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR + VR GLB Viewer</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR Hit Test -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-ar-hit-test-component/dist/aframe-ar-hit-test-component.min.js"></script>
</head>

<body>

<a-scene
  embedded
  renderer="colorManagement: true;"
  vr-mode-ui="enabled: true"
  webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay;"
  ar-hit-test="target: #reticle"
>

  <!-- Camera -->
  <a-camera position="0 1.6 0"></a-camera>

  <!-- Lighting -->
  <a-light type="ambient" intensity="1"></a-light>
  <a-light type="directional" position="1 3 2" intensity="1"></a-light>

  <!-- Reticle -->
  <a-entity
    id="reticle"
    geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.07"
    material="color: green"
    rotation="-90 0 0"
    visible="false">
  </a-entity>

  <!-- Model -->
  <a-entity
    id="model"
    gltf-model="model.glb"
    scale="0.3 0.3 0.3"
    rotation="0 180 0"
    visible="false">
  </a-entity>

</a-scene>

<script>
const reticle = document.querySelector('#reticle');
const model = document.querySelector('#model');
const scene = document.querySelector('a-scene');

// Show reticle when surface detected
scene.addEventListener('ar-hit-test-start', () => {
  reticle.setAttribute('visible', true);
});

// Place model on screen tap
window.addEventListener('click', () => {
  if (reticle.getAttribute('visible')) {
    const pos = reticle.getAttribute('position');
    model.setAttribute('position', pos);
    model.setAttribute('visible', true);
  }
});

// Debug logs
model.addEventListener('model-loaded', () => {
  console.log("✅ Model Loaded Successfully");
});

model.addEventListener('model-error', (e) => {
  console.error("❌ Model Failed to Load", e);
});
</script>

</body>
</html>
