<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR + VR GLB Viewer</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR Hit Test -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-ar-hit-test-component/dist/aframe-ar-hit-test-component.min.js"></script>
</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled: true"
  renderer="colorManagement: true;"
  xrweb="requiredFeatures: hit-test, local-floor"
  ar-hit-test="target: #reticle"
>

  <!-- Camera -->
  <a-camera position="0 1.6 0"></a-camera>

  <!-- Lighting (VERY IMPORTANT for GLB visibility) -->
  <a-light type="ambient" intensity="1"></a-light>
  <a-light type="directional" position="1 3 2" intensity="1"></a-light>

  <!-- Reticle -->
  <a-entity
    id="reticle"
    geometry="primitive: ring; radiusInner: 0.06; radiusOuter: 0.08"
    material="color: green"
    rotation="-90 0 0"
    visible="false">
  </a-entity>

  <!-- Model -->
  <a-entity
    id="model"
    gltf-model="url(model.glb)"
    scale="0.3 0.3 0.3"
    rotation="0 180 0"
    visible="false">
  </a-entity>

</a-scene>

<script>
const reticle = document.querySelector('#reticle');
const model = document.querySelector('#model');
const scene = document.querySelector('a-scene');

// Show reticle when surface is detected
scene.addEventListener('ar-hit-test', () => {
  reticle.setAttribute('visible', true);
});

// Place model on tap
window.addEventListener('click', () => {
  if (reticle.getAttribute('visible')) {
    const pos = reticle.getAttribute('position');
    model.setAttribute('position', pos);
    model.setAttribute('visible', true);
  }
});

// DEBUG: Check if model loaded
model.addEventListener('model-loaded', () => {
  console.log("✅ Model Loaded Successfully");
});

model.addEventListener('model-error', () => {
  console.error("❌ Model Failed to Load");
});
</script>

</body>
</html>
